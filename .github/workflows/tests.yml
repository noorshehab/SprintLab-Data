name: Property Tests
run-name: ${{ github.actor }} is running the noxed property-test suite
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements/base.txt'
      - 'requirements/ml.txt'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements/base.txt -r requirements/ml.txt
      - run: pytest tests/ -q
